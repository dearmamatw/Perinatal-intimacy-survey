<style>
  :root{
    --cream:#FBF6EC; --cream-2:#F5ECDA; --soft:#EFE2C6;
    --gold:#C8912E; --gold-d:#9E6E1C; --gold-soft:#E0B764;
    --ink:#3A3222; --body:#6B6252; --faint:#A99C86; --line:#E4D6BA; --help:#FBEFD6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(ellipse 75% 50% at 50% 20%, #FEFCF5 0%, var(--cream) 58%, #F3EAD6 100%);
    color:var(--body); line-height:1.75; min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:40px 20px 96px}
  .eyebrow{color:var(--gold);font-size:13px;letter-spacing:3px;margin-bottom:10px;font-weight:600;text-align:center}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:26px;color:var(--ink);text-align:center;line-height:1.5}
  .lead{color:var(--body);font-size:15px;text-align:center;margin-top:8px}
  .rule{width:38px;height:2px;background:var(--gold);opacity:.55;border-radius:2px;margin:24px auto}
  .card{background:var(--cream-2);border:1px solid var(--soft);border-radius:18px;padding:24px 20px;margin-top:18px;
    box-shadow:0 8px 24px rgba(160,122,74,.06)}
  .counter{background:var(--help);border:1px solid var(--soft);border-radius:999px;
    padding:14px 24px;text-align:center;font-size:17px;color:var(--body);margin:20px auto;max-width:420px}
  .counter b{color:var(--gold-d);font-size:22px}
  .stat-label{font-weight:700;color:var(--ink);font-size:15px;margin-top:20px;font-family:"Noto Serif TC",serif}
  .bar-row{margin-top:8px}
  .bar-head{display:flex;justify-content:space-between;font-size:13px;color:var(--body)}
  .bar-track{height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
  .bar-fill{height:100%;background:var(--gold);border-radius:6px;transition:width .8s ease}
  .footnote{font-size:12px;color:var(--faint);margin-top:16px}
  .waiting{text-align:center;color:var(--faint);font-size:14px;padding:20px 0}
  .cta{text-align:center;margin-top:28px;font-size:14px}
  a.link{color:var(--gold-d);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--soft);padding-bottom:1px}
  a.link:hover{border-bottom-color:var(--gold)}
  .btn{display:inline-block;background:var(--gold);color:#fff;font-weight:700;border:none;border-radius:999px;
    padding:13px 32px;font-size:15px;text-decoration:none;box-shadow:0 6px 18px rgba(200,145,46,.28);margin-top:10px}
  .btn:hover{background:var(--gold-d)}
  .moon{text-align:center;color:var(--gold-d);font-size:26px;margin-top:34px}
  .brand{text-align:center;color:var(--faint);font-size:13px;margin-top:8px}
</style>

<style id="dm-theme">
/* ===== Dear mama 芥末黃品牌主題 ===== */
.dm-logo{display:inline-block;line-height:0}
.dm-logo img{width:clamp(150px,18vw,200px);height:auto;display:block}
html:not(#_) body, html:not(#_) h1, html:not(#_) h2, html:not(#_) h3, html:not(#_) .serif,
html:not(#_) button, html:not(#_) input, html:not(#_) textarea{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
@media screen{ html:not(#_) body{background:#EFB64E;background-image:none} }

html:not(#_){
  --cream:#FDF6EF; --cream-2:#FDF6EF; --soft:rgba(26,37,71,.14);
  --gold:#1A2547; --gold-d:#1A2547; --gold-soft:#3B4C80; --sage:#1A2547;
  --ink:#1A2547; --body:#1A2547; --faint:rgba(26,37,71,.62); --line:rgba(26,37,71,.18); --help:#FBE7BF;
  --night:#FDF6EF; --night-2:#FDF6EF; --cream-dim:rgba(26,37,71,.62); --danger:#A3352B;
}
h1{font-weight:900}
.eyebrow{font-weight:700}
.card{border:none;border-radius:26px;box-shadow:0 10px 26px rgba(26,37,71,.10)}
.btn-primary,.btn{box-shadow:0 6px 18px rgba(26,37,71,.22)}

.wrap{padding-top:26px}
.dm-top{margin-bottom:26px}
.counter{border:none;background:#FDF6EF}
.bar-track{border-color:rgba(26,37,71,.15)}
.moon{color:#1A2547}
.brand{color:rgba(26,37,71,.7)}
</style>
<style id="dm-lang">
html body .dm-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
html body .dm-lang{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#FDF6EF;
  box-shadow:inset 0 0 0 1.5px rgba(26,37,71,.2);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px;font-weight:700;line-height:1;letter-spacing:.04em;flex-shrink:0;text-indent:0}
html body .dm-lang a{display:block;padding:7px 12px;border-radius:999px;color:#1A2547;text-decoration:none;border:none;transition:background .15s ease}
html body .dm-lang a:hover{background:rgba(26,37,71,.08)}
html body .dm-lang a[aria-current]{background:#1A2547;color:#fff;cursor:default}
@media print{html body .dm-lang{display:none}}
</style>

function tr(s){ if(s==null) return s; if(TR_EN[s]) return TR_EN[s]; const k=String(s).split('（')[0]; return TR_EN[k]||s; }

const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwGzi_4BlphjcMYMmagMa-LzTOAy6rEMx1pW_zXOVYVzGYoO_xgistiI2FIe7E0SFQ1/exec';

/* 甜甜圈圖（二選一題用）：主色金、次色淺金 */
function donutSVG(items){
  const a=items[0], b=items[1];
  const R=54, C=2*Math.PI*R;              // 半徑與周長
  const lenA=C*a.pct/100;
  return `
  <div style="display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 140 140" style="width:132px;height:132px;flex:0 0 auto" role="img"
         aria-label="${tr(a.option)} ${a.pct}%, ${tr(b.option)} ${b.pct}%">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="#F6D9A0" stroke-width="20"/>
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="#1A2547" stroke-width="20"
              stroke-dasharray="${lenA} ${C-lenA}" stroke-dashoffset="0"
              transform="rotate(-90 70 70)" stroke-linecap="butt"/>
      <text x="70" y="66" text-anchor="middle" font-family="Noto Serif TC,serif"
            font-size="26" font-weight="700" fill="#1A2547">${a.pct}%</text>
      <text x="70" y="86" text-anchor="middle" font-size="11" fill="#55607F">${tr(a.option)}</text>
    </svg>
    <div style="font-size:13.5px;line-height:2">
      <div><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#1A2547;margin-right:7px"></span>${tr(a.option)} <b style="color:#1A2547">${a.pct}%</b></div>
      <div><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#F6D9A0;margin-right:7px"></span>${tr(b.option)} <b style="color:#1A2547">${b.pct}%</b></div>
    </div>
  </div>`;
}

fetch(SUBMIT_URL + '?stats=1')
  .then(r=>r.json())
  .then(res=>{
    const counter=document.getElementById('counter');
    const card=document.getElementById('statsCard');
    if(!res || !res.ok){ showWaiting(); return; }

    counter.innerHTML = `<b>${res.n}</b> people have walked this time corridor so far 🕯`;

    if(res.n >= res.minN && res.stats && res.stats.length){
      let h='';
      res.stats.forEach(s=>{
        h += `<p class="stat-label">${tr(s.label)}</p>`;
        if(s.chart==='donut' && s.items.length===2){
          h += donutSVG(s.items);
        } else {
          s.items.forEach(it=>{
            h += `
            <div class="bar-row">
              <div class="bar-head"><span>${tr(it.option)}</span><span>${it.pct}%</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${it.pct}%"></div></div>
            </div>`;
          });
        }
        if(s.disclaimer){
          h += `<p class="footnote" style="margin-top:8px">* Shared positions are personal experience only, not medical advice. Every pregnancy is different, so please talk to your doctor.</p>`;
        }
      });
      h += `<p class="footnote">* Collected by Dear Mama, not randomly sampled, and not representative of everyone. Each question uses the people who answered it as the base.</p>`;
      card.innerHTML=h;
    } else {
      const left=Math.max(0,res.minN-res.n);
      card.innerHTML = `<p class="waiting"><span style="color:var(--gold-d);font-weight:700;font-size:16px">${left} more responses and the charts will light up</span><br><br>
      With too few people, percentages can be misleading,<br>and a few people's answers might be recognizable.<br>
      So we'd rather wait a little before sharing numbers.<br><br>
      Every voice right now is making the light brighter. 🕯</p>`;
    }
  })
  .catch(()=>{ showWaiting(); });

/* 讀不到統計時的畫面：溫和的等待訊息（人數不會顯示，方便你判斷後端狀況） */
function showWaiting(){
  document.getElementById('counter').innerHTML='🕯 Everyone\'s voices are lighting up, one by one';
  document.getElementById('statsCard').innerHTML=
    `<p class="waiting">Once there are 30 responses,<br>everyone's results will appear here.<br><br>
     With too few people, percentages can be misleading,<br>and a few people's answers might be recognizable,<br>
     so we'd rather wait a little before sharing numbers.<br><br>
     Thank you for your patience.<br>Come back and check any time. 🌙</p>`;
}
