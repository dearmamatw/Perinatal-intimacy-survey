<style>
  :root{
    /* 暖色系（與落地頁、PDF 一致） */
    --cream:#FBF6EC;      /* 底色 奶油 */
    --cream-2:#F5ECDA;    /* 卡片底 */
    --soft:#EFE2C6;       /* 卡片邊、淺塊 */
    --gold:#C8912E;       /* 主金 */
    --gold-d:#9E6E1C;     /* 深金 */
    --gold-soft:#E0B764;  /* 亮金 */
    --sage:#B07A4A;       /* 陶土棕（輔色，取代原莧綠當 hover） */
    --ink:#3A3222;        /* 標題深墨 */
    --body:#6B6252;       /* 內文 */
    --faint:#A99C86;      /* 次要字 */
    --line:#E4D6BA;       /* 分隔線、邊框 */
    --help:#FBEFD6;       /* 危機專線框底 */
    /* 相容舊變數名，指向新色 */
    --night:#FBF6EC;
    --night-2:#F5ECDA;
    --cream-dim:#8A8069;
    --danger:#B07A4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:
      radial-gradient(ellipse 75% 50% at 50% 20%, #FEFCF5 0%, var(--cream) 58%, #F3EAD6 100%);
    color:var(--body);
    line-height:1.75;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 20px 96px}

  /* 進度：一盞一盞亮起的燈 */
  .lamps{display:flex;gap:8px;justify-content:center;margin:8px 0 28px;flex-wrap:wrap}
  .lamp{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--line);color:var(--faint);font-size:12px;transition:.5s;background:#fff}
  .lamp.on{border-color:var(--gold);color:#fff;
    background:radial-gradient(circle at 50% 40%, var(--gold-soft), var(--gold));
    box-shadow:0 0 16px rgba(200,145,46,.4)}
  .lamp.current{transform:scale(1.15)}

  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:26px;letter-spacing:.5px;
    line-height:1.45;margin-bottom:6px;color:var(--ink)}
  h2{font-family:"Noto Serif TC",serif;font-weight:600;font-size:21px;color:var(--gold-d);
    margin:2px 0 4px;letter-spacing:.5px}
  .eyebrow{color:var(--gold);font-size:13px;letter-spacing:3px;margin-bottom:10px;font-weight:600}
  .lead{color:var(--body);font-size:15px}

  .card{background:var(--cream-2);
    border:1px solid var(--soft);border-radius:18px;padding:24px 20px;margin-top:18px;
    box-shadow:0 8px 24px rgba(160,122,74,.06)}

  .q{margin:22px 0 6px}
  .q-num{color:var(--gold);font-size:12px;letter-spacing:2px}
  .q-text{font-size:16.5px;font-weight:600;margin-top:2px;color:var(--ink)}
  .q-hint{color:var(--faint);font-size:13px;margin-top:4px}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid var(--line);
    border-radius:12px;cursor:pointer;background:#fff;transition:.18s;font-size:15px;color:var(--ink)}
  .opt:hover{border-color:var(--gold)}
  .opt.sel{border-color:var(--gold);background:rgba(200,145,46,.10);box-shadow:0 0 0 1px var(--gold) inset}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);flex:0 0 auto;margin-top:2px}
  .opt.sel .dot{border-color:var(--gold);background:var(--gold)}
  .opt.multi .dot{border-radius:5px}

  /* 量表 1-10 */
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
  .scale button{aspect-ratio:1;border:1px solid var(--line);background:#fff;color:var(--body);
    border-radius:9px;font-size:14px;cursor:pointer;transition:.15s}
  .scale button:hover{border-color:var(--gold)}
  .scale button.sel{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
  .scale-ends{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;margin-top:6px}

  input[type=text],input[type=number],textarea{
    width:100%;background:#fff;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:15px;margin-top:10px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .sub{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--body);font-size:14px}
  .sub input{margin-top:0;width:90px}

  .skip{display:inline-block;margin-top:10px;background:none;border:none;color:var(--faint);
    font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:inherit}
  .skip:hover{color:var(--gold-d)}
  .skipped{color:var(--gold-d);font-size:12.5px;margin-top:8px}

  .nav{display:flex;gap:12px;margin-top:26px}
  .btn{flex:1;padding:14px;border-radius:999px;border:none;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.18s;letter-spacing:.03em}
  .btn-primary{background:var(--gold);color:#fff;box-shadow:0 6px 18px rgba(200,145,46,.28)}
  .btn-primary:hover{background:var(--gold-d);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--body);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-d)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .note{background:var(--help);border:1px solid var(--soft);
    border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--body);margin-top:16px;line-height:1.9}
  .note b{color:var(--gold-d)}

  .stage-title{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
  .stage-title .n{font-family:"Noto Serif TC",serif;color:var(--gold);font-size:15px}

  .center{text-align:center}
  .divider{width:38px;height:2px;background:var(--gold);opacity:.55;border-radius:2px;margin:24px auto}

  .summary{white-space:pre-wrap;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:16px;font-size:13px;color:var(--body);margin-top:14px;
    max-height:280px;overflow:auto;font-family:ui-monospace,monospace;line-height:1.6}

  a.link{color:var(--gold-d);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--soft);padding-bottom:1px}
  a.link:hover{border-bottom-color:var(--gold)}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>

.card{border:none;border-radius:26px;box-shadow:0 10px 26px rgba(26,37,71,.10)}

.wrap{padding-top:6px}
.dm-top-out{max-width:640px;margin:0 auto;padding:26px 20px 0}

.divider{opacity:.35}
</style>

html body .dm-lang{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#FDF6EF;

function renderQ(q){
  // note 型：純說明文字，不是題目、不可作答
  if(q.type==='note'){
    return `<div class="q" id="q_${q.id}"><div class="note" style="margin-top:4px">${q.text}</div></div>`;
  }
  const v = state.data[q.id];
  let h=`<div class="q" id="q_${q.id}"><div class="q-num">${q.num||''}</div><div class="q-text">${q.text}</div>`;
  if(q.hint) h+=`<div class="q-hint">${q.hint}</div>`;

  if(q.type==='single'){
    h+='<div class="opts">';
    q.opts.forEach(o=>{
      const sel = v && v.choice===o ? 'sel':'';
      h+=`<div class="opt ${sel}" onclick="pickSingle('${q.id}','${o}',${!!q.other})"><span class="dot"></span><span>${tr(o)}</span></div>`;
    });
    h+='</div>';
    if(q.other && v && /其他|以外/.test(v.choice||'')){
      h+=`<input type="text" placeholder="${q.otherLabel||'Please describe'}" value="${(v.other||'').replace(/"/g,'&quot;')}" oninput="setOther('${q.id}',this.value)">`;
    }
    if(q.extra==='status' && v){
      if(v.choice==='懷孕中'||v.choice==='待產中') h+=`<div class="sub">About <input type="number" oninput="setSub('${q.id}','week',this.value)" value="${state.data[q.id]?.week||''}"> weeks along</div>`;
      if(v.choice==='產後一年內') h+=`<div class="sub">Baby is <input type="text" oninput="setSub('${q.id}','baby',this.value)" value="${state.data[q.id]?.baby||''}"> (months / years old)</div>`;
    }
  }
  else if(q.type==='multi'){
    h+='<div class="opts">';
    const arr = (v&&v.choices)||[];
    q.opts.forEach(o=>{
      const sel = arr.includes(o)?'sel':'';
      h+=`<div class="opt multi ${sel}" onclick="pickMulti('${q.id}','${o}',${!!q.other})"><span class="dot"></span><span>${tr(o)}</span></div>`;
    });
    h+='</div>';
    if(q.other && arr.includes('其他')){
      h+=`<input type="text" placeholder="Please describe" value="${(v.other||'').replace(/"/g,'&quot;')}" oninput="setOther('${q.id}',this.value)">`;
    }
  }
  else if(q.type==='scale'){
    h+='<div class="scale">';
    for(let i=1;i<=10;i++){
      const sel = v===i?'sel':'';
      h+=`<button class="${sel}" onclick="setScale('${q.id}',${i})">${i}</button>`;
    }
    h+='</div><div class="scale-ends"><span>1 · Very dissatisfied</span><span>Very satisfied · 10</span></div>';
  }
  else if(q.type==='text'){
    h+=`<input type="text" value="${(v||'').toString().replace(/"/g,'&quot;')}" oninput="setText('${q.id}',this.value)" placeholder="Type here">`;
  }
  else if(q.type==='number'){
    h+=`<input type="number" value="${v!=null?v:''}" oninput="setText('${q.id}',this.value)" placeholder="Number">`;
  }
  else if(q.type==='textarea'){
    h+=`<textarea oninput="setText('${q.id}',this.value)" placeholder="Write as much as you like, or leave it blank">${v||''}</textarea>`;
  }

  if(q.skippable){
    const isSkip = state.data['__skip_'+q.id];
    h+= isSkip
      ? `<div class="skipped">Skipped · <span class="skip" style="color:var(--gold-soft)" onclick="unskip('${q.id}')">Answer it after all</span></div>`
      : `<button class="skip" onclick="skip('${q.id}')">Skip this question</button>`;
  }
  h+='</div>';
  return h;
}

/* ---------- 作答存取（就地更新，不整頁重繪、不捲動） ---------- */
function findQ(id){
  const st=STAGES[state.stageIdx];
  return st.qs ? st.qs.find(q=>q.id===id) : null;
}
function repaintQ(id){
  const q=findQ(id); if(!q){ render(); return; }
  const wrap=document.getElementById('q_'+id);
  if(!wrap){ render(); return; }
  const tmp=document.createElement('div');
  tmp.innerHTML=renderQ(q);
  wrap.replaceWith(tmp.firstElementChild);
  refreshNext();
}
function pickSingle(id,val,hasOther){
  state.data[id]={choice:val}; delete state.data['__skip_'+id]; repaintQ(id);
}
function pickMulti(id,val){
  const cur = state.data[id]?.choices||[];
  const i=cur.indexOf(val);
  if(i>=0)cur.splice(i,1); else cur.push(val);
  state.data[id]={...(state.data[id]||{}),choices:cur};
  delete state.data['__skip_'+id]; repaintQ(id);
}
function setOther(id,v){ state.data[id]={...(state.data[id]||{}),other:v}; refreshNext(); }
function setSub(id,k,v){ state.data[id]={...(state.data[id]||{}),[k]:v}; }
function setScale(id,v){ state.data[id]=v; delete state.data['__skip_'+id]; repaintQ(id); }
function setText(id,v){ state.data[id]=v; delete state.data['__skip_'+id]; refreshNext(); }
function skip(id){ state.data['__skip_'+id]=true; delete state.data[id]; repaintQ(id); }
function unskip(id){ delete state.data['__skip_'+id]; repaintQ(id); }

function buildSummary(){
  const L=labelMap(); let out='[Dear Mama | Intimacy in pregnancy: looking back]\n';
  out+='Filled in: '+new Date().toLocaleString('en-US')+'\n';
  out+='———————————————\n';
  for(const key in L){
    let v=state.data[key];
    if(state.data['__skip_'+key]){ out+=`${tr(L[key])}: (skipped)\n`; continue; }
    if(v==null||v==='') continue;
    if(typeof v==='object'){
      let s = tr(v.choice||'');
      if(v.choices) s=v.choices.map(tr).join('; ');
      if(v.other) s+=` (${v.other})`;
      if(v.week) s+=` | about ${v.week} weeks`;
      if(v.baby) s+=` | baby: ${v.baby}`;
      out+=`${tr(L[key])}: ${s}\n`;
    } else out+=`${tr(L[key])}: ${v}\n`;
  }
  return out;
}

    </div>
    <div id="cardOut" class="center"></div>
    <p style="margin-top:10px;font-size:12px;color:var(--faint);text-align:center">The image only includes the part above, never the private part below.</p>
  </div>`;
  if(priv){
    h+=`
  <div class="card" style="margin-top:14px;border-style:dashed">
    <p style="text-align:center;font-size:13px;color:var(--gold-d);font-weight:700">🔒 This part is just for you</p>
    <div style="margin-top:8px;font-size:14px;line-height:2;color:var(--body)">${priv}</div>
    <p style="margin-top:10px;font-size:12px;color:var(--faint);text-align:center">Whether anyone else sees this part is up to you.</p>
  </div>`;
  }
  return h;
}

/* 統計載入後，把群體對照補進報告 */
function fillCompare(res){
  if(!res || !res.ok || res.n < res.minN || !res.stats) return;
  const find=(label)=>res.stats.find(s=>s.label.indexOf(label)>=0);
  const resumeStat=find('產後多久'), reasonStat=find('產後影響');
  const myResume=gc('pp_resume');
  const elR=document.getElementById('cmpResume');
  if(elR && resumeStat && myResume){
    const it=resumeStat.items.find(i=>i.option===myResume);
    if(it && it.pct>=15) elR.innerHTML=` (of everyone who has walked this corridor, <b>${it.pct}% did too</b>)`;
  }
  const elRe=document.getElementById('cmpReason');
  const myReasons=[...gm('pg_reason'),...gm('pp_reason')];
  if(elRe && reasonStat && myReasons.length){
    const it=reasonStat.items.find(i=>myReasons.indexOf(i.option)>=0);
    if(it && it.pct>=15) elRe.innerHTML=` (<b>${it.pct}% of people chose this too</b>)`;
  }
}

/* 讀取統計並渲染（完成頁與結果頁共用）
   withLit = true 時顯示文獻回饋段落 */
function loadStats(targetId, withLit){
  const box=document.getElementById(targetId);
  if(!box) return;
  fetch(SUBMIT_URL + '?stats=1')
    .then(r=>r.json())
    .then(res=>{
      if(!res || !res.ok){ box.innerHTML=statsFallback(withLit); return; }
      let h = `<p class="center" style="font-size:16px"><b style="color:var(--gold-d)">${res.n} people</b> have walked this time corridor so far 🕯</p>`;
      if(withLit){
        h += `<p style="margin-top:12px;font-size:13.5px">Did you know? A 2009 BabyHome survey of pregnant moms in Taiwan (1,006 valid responses) found that <b>70.4% still had a sex life during pregnancy</b>, and <b>86% of them worried it might affect the pregnancy or the baby</b>. Your worries and hesitation are shared by many. The road you\'ve walked, many others are walking too.</p>`;
      }
      if(res.n >= res.minN && res.stats && res.stats.length){
        h += `<div style="margin-top:16px">`;
        res.stats.forEach(s=>{
          h += `<p style="font-weight:700;color:var(--ink);font-size:14px;margin-top:14px">${tr(s.label)}</p>`;
          if(s.chart==='donut' && s.items.length===2){
            h += donutMini(s.items);
          } else {
            s.items.forEach(it=>{
              h += `
              <div style="margin-top:6px">
                <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--body)">
                  <span>${tr(it.option)}</span><span>${it.pct}%</span>
                </div>
                <div style="height:8px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden">
                  <div style="height:100%;width:${it.pct}%;background:var(--gold);border-radius:6px"></div>
                </div>
              </div>`;
            });
          }
          if(s.disclaimer){
            h += `<p style="margin-top:6px;font-size:11.5px;color:var(--faint)">* Shared positions are personal experience only, not medical advice. Every pregnancy is different, so please talk to your doctor.</p>`;
          }
        });
        h += `<p style="margin-top:12px;font-size:12px;color:var(--faint)">* Collected by the show, not randomly sampled, and not representative of everyone.</p></div>`;
      } else {
        const left=Math.max(0,res.minN-res.n);
        h += `<p style="margin-top:10px;font-size:13px;color:var(--faint)" class="center">
        <b style="color:var(--gold-d)">${left} more responses and everyone\'s charts will light up.</b><br>
        With too few people, percentages can be misleading, and a few people\'s answers might be recognizable.<br>
        So we\'d rather wait a little before sharing numbers.<br>
        <span style="color:var(--gold-d)">Your response has already made the light a little brighter. 🕯</span></p>`;
      }
      box.innerHTML = h;
      fillCompare(res);
    })
    .catch(()=>{ box.innerHTML=statsFallback(withLit); });
}
/* ── 分享圖卡（canvas 直接畫，1080×1350）── */
function makeShareCard(){
  const out=document.getElementById('cardOut');
  out.innerHTML=`<p style="margin-top:12px;font-size:13px;color:var(--faint)">Lighting the lamp…</p>`;
  const go=()=>{ try{ drawShareCard(out); }catch(e){
    out.innerHTML=`<p style="margin-top:12px;font-size:13px;color:var(--faint)">The image couldn\'t be made, but you can take a screenshot of the part above 🌙</p>`; } };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
}

function drawShareCard(out){
  const W=1080,H=1350;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');

  // 底色：暖奶油漸層
  const g=x.createRadialGradient(W/2,H*0.3,60,W/2,H*0.3,W*0.95);
  g.addColorStop(0,'#F4C76C'); g.addColorStop(.55,'#EFB64E'); g.addColorStop(1,'#E8A93A');
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // 金色細邊框（在限動白底上更立體）
  const pad=44, r=30;
  x.beginPath();
  x.moveTo(pad+r,pad);
  x.lineTo(W-pad-r,pad);      x.quadraticCurveTo(W-pad,pad,W-pad,pad+r);
  x.lineTo(W-pad,H-pad-r);    x.quadraticCurveTo(W-pad,H-pad,W-pad-r,H-pad);
  x.lineTo(pad+r,H-pad);      x.quadraticCurveTo(pad,H-pad,pad,H-pad-r);
  x.lineTo(pad,pad+r);        x.quadraticCurveTo(pad,pad,pad+r,pad);
  x.closePath();
  x.strokeStyle='#1A2547'; x.globalAlpha=.45; x.lineWidth=3; x.stroke();
  x.globalAlpha=.18; x.lineWidth=1; x.strokeStyle='#1A2547';
  x.setLineDash([]); x.stroke();
  x.globalAlpha=1;

  const SERIF='"Noto Sans TC",sans-serif', SANS='"Noto Sans TC",sans-serif';
  x.textAlign='center';

  // 上方疏排小標
  x.fillStyle='#1A2547'; x.font='700 27px '+SANS;
  spaced(x,'THE INTIMACY TIME CORRIDOR',W/2,140,5);

  // 主標
  x.fillStyle='#1A2547'; x.font='900 58px '+SERIF;
  x.fillText('My Time Corridor',W/2,246);

  // 金色細線
  x.fillStyle='#1A2547'; x.globalAlpha=.6;
  x.fillRect(W/2-38,300,76,4); x.globalAlpha=1;

  // 內文：限定在 Y0～Y1 之間，優先讓每一句都不跳行
  const Y0=350, Y1=H-210, AVAIL=Y1-Y0, MAXW=W-190;
  let fs=0, lines=[], lh=0, block=0;

  // 第一輪：找一個字級，讓每一句都能單行容納（42 → 30）
  for(let t=42;t>=30;t-=1){
    x.font=t+'px '+SANS;
    const fitAll=SHARE_LINES.every(s=>x.measureText(s.replace(/\*/g,'')).width<=MAXW);
    if(!fitAll) continue;
    const L=Math.round(t*1.72), n=SHARE_LINES.length*2-1;
    if(n*L<=AVAIL){ fs=t; lh=L;
      lines=[]; SHARE_LINES.forEach((s,i)=>{ if(i) lines.push(''); lines.push(s.replace(/\*/g,'')); });
      block=lines.length*lh; break; }
  }

  // 第二輪：真的塞不下才斷行（斷點落在標點）
  if(!fs){
    for(fs=40;;fs-=2){
      lh=Math.round(fs*1.72); lines=[];
      SHARE_LINES.forEach((t,i)=>{ if(i) lines.push('');
        wrap(x,t.replace(/\*/g,''),MAXW,fs+'px '+SANS).forEach(s=>lines.push(s)); });
      block=lines.length*lh;
      if(block<=AVAIL || fs<=26) break;
    }
    while(block>AVAIL && lines.length>3){
      lines.splice(lines.length-2,1); block=lines.length*lh;
    }
  }

  x.font=fs+'px '+SANS; x.fillStyle='#1A2547'; x.textAlign='center';
  let y=Y0+Math.max(0,(AVAIL-block)/2)+lh*0.75;
  lines.forEach(s=>{ if(s) x.fillText(s,W/2,y); y+=lh; });

  // 頁尾
  x.fillStyle='rgba(26,37,71,.7)'; x.font='28px '+SANS;
  x.fillText('Dear Mama 🌙',W/2,H-132);
  x.fillText('Dr. Li-Ling × Dr. Niu',W/2,H-88);

  const url=cv.toDataURL('image/png');
  out.innerHTML=`
    <img src="${url}" alt="My Time Corridor" style="width:100%;max-width:300px;border-radius:14px;border:1px solid var(--soft);margin-top:14px">
    <div style="margin-top:10px">
      <a class="link" href="${url}" download="my-time-corridor.png">⬇ Download this image</a>
    </div>
    <p style="margin-top:6px;font-size:12px;color:var(--faint)">On a phone, you can also press and hold the image to save it</p>`;
}

// 字距排版（canvas 無 letter-spacing）
function spaced(ctx,text,cx,y,gap){
  const chars=[...text];
  const w=chars.reduce((s,c)=>s+ctx.measureText(c).width+gap,0)-gap;
  let cur=cx-w/2;
  chars.forEach(c=>{ const cw=ctx.measureText(c).width;
    ctx.textAlign='left'; ctx.fillText(c,cur,y); cur+=cw+gap; });
  ctx.textAlign='center';
}
// English word wrap
function wrap(ctx,text,maxW,font){
  ctx.font=font;
  if(ctx.measureText(text).width<=maxW) return [text];
  const words=text.split(' '); const out=[]; let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t;
  }
  if(line) out.push(line);
  return out;
}

/* 完成頁用的小甜甜圈（二選一題） */
function donutMini(items){
  const a=items[0], b=items[1];
  const R=48, C=2*Math.PI*R, lenA=C*a.pct/100;
  return `
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 126 126" style="width:112px;height:112px;flex:0 0 auto" role="img"
         aria-label="${tr(a.option)} ${a.pct}%, ${tr(b.option)} ${b.pct}%">
      <circle cx="63" cy="63" r="${R}" fill="none" stroke="#F6D9A0" stroke-width="18"/>
      <circle cx="63" cy="63" r="${R}" fill="none" stroke="#1A2547" stroke-width="18"
              stroke-dasharray="${lenA} ${C-lenA}" transform="rotate(-90 63 63)"/>
      <text x="63" y="60" text-anchor="middle" font-family="Noto Serif TC,serif"
            font-size="23" font-weight="700" fill="#1A2547">${a.pct}%</text>
      <text x="63" y="78" text-anchor="middle" font-size="10" fill="#55607F">${tr(a.option)}</text>
    </svg>
    <div style="font-size:12.5px;line-height:1.95">
      <div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1A2547;margin-right:6px"></span>${tr(a.option)} <b style="color:var(--gold-d)">${a.pct}%</b></div>
      <div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#F6D9A0;margin-right:6px"></span>${tr(b.option)} <b style="color:var(--gold-d)">${b.pct}%</b></div>
    </div>
  </div>`;
}

function statsFallback(withLit){
  let h='';
  if(withLit){
    h += `<p style="font-size:13.5px">Did you know? A 2009 BabyHome survey of pregnant moms in Taiwan (1,006 valid responses) found that <b>70.4% still had a sex life during pregnancy</b>, and <b>86% of them worried it might affect the pregnancy or the baby</b>. The road you\'ve walked, many others are walking too.</p>`;
  }
  h += `<p class="center" style="margin-top:10px;font-size:12.5px;color:var(--faint)">🕯 Everyone\'s voices are lighting up one by one. Once there are 30 responses, the overall results will appear here.<br>We\'ve received what you just sent. Thank you for your patience.</p>`;
  return h;
}
function sendFail(){
  const card=document.getElementById('submitCard');
  card.innerHTML=`
    <h2>That didn\'t send</h2>
    <p class="lead" style="margin-top:8px">It may be your connection. You can try again, and if it still doesn\'t work, you can just close the page. It won\'t affect you.</p>
    <div class="nav" style="margin-top:16px">
      <button class="btn btn-primary" onclick="doSend()">Try again</button>
    </div>`;
}

/* 把答案攤平成「一行一人」的物件，欄位 key 固定，方便試算表對欄 */
function buildRow(){
  const L=labelMap(); const row={};
  row['填答時間']=new Date().toLocaleString('zh-TW');
  for(const key in L){
    const label=L[key];
    if(state.data['__skip_'+key]){ row[label]='（跳過）'; continue; }
    let v=state.data[key];
    if(v==null||v===''){ row[label]=''; continue; }
    if(typeof v==='object'){
      let s=v.choice||'';
      if(v.choices) s=v.choices.join('、');
      if(v.other) s+=`（${v.other}）`;
      if(v.week) s+=`｜約${v.week}週`;
      if(v.baby) s+=`｜寶寶${v.baby}`;
      row[label]=s;
    } else row[label]=v;
  }
  return row;
}

render();
</script>
